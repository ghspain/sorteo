services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      # Ensure Streamlit server accepts connections from all hosts
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    networks:
      - raffle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Development environment with hot-reload
  raffle-app-dev:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8502:8501"
    volumes:
      - ./:/app
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=true
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    command: streamlit run app.py --server.runOnSave=true
    networks:
      - raffle-network
    restart: unless-stopped
    profiles: ["dev"]

  # Test environment with Playwright support
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./:/app
    environment:
      - PYTHONPATH=/app
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - STREAMLIT_HOST=app # This makes sure it connects to the app service
      - STREAMLIT_PORT=8501
    depends_on:
      app:
        condition: service_healthy # Wait until app is ready before starting tests
    networks:
      - raffle-network
    profiles: ["test"]

  # Documentation service using MkDocs
  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./docs:/app/docs
      - ./mkdocs.yml:/app/mkdocs.yml:ro
    networks:
      - raffle-network
    restart: unless-stopped
    command: mkdocs serve --dev-addr 0.0.0.0:8000
    profiles: ["docs", "dev"]

networks:
  raffle-network:
    driver: bridge